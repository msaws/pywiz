name: Test Runner

on:
  push:
    branches:
      - mian

  jobs:
    test:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show System Information
        run: |
          echo "Running on: "
          hostname
          whoami
          pwd

      - name: List Files
        run: |
          ls -la
